<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenSpace — Админ-панель</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Экран входа -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1>🌿 GreenSpace Admin</h1>
            <p class="login-hint">Вход только для администраторов</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </div>
    </div>

    <!-- Админ-панель -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <div class="admin-header__container">
                <div class="admin-header__logo">🌿 GreenSpace Admin</div>
                <div class="admin-header__user" id="userInfo"></div>
                <button class="btn btn-logout" id="logoutBtn">Выйти</button>
            </div>
        </header>

        <main class="admin-main">
            <!-- Управление растениями -->
            <section class="admin-section">
                <h2>🌱 Управление растениями</h2>
                
                <div class="admin-card">
                    <h3>Добавить растение</h3>
                    <form id="plantForm" class="admin-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Название *</label>
                                <input type="text" id="plantName" required>
                            </div>
                            <div class="form-group">
                                <label>Цена (₽) *</label>
                                <input type="number" id="plantPrice" step="0.01" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Описание *</label>
                            <textarea id="plantDescription" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Путь к изображению</label>
                            <input type="text" id="plantPicture" placeholder="images/растение.jpg">
                        </div>
                        <div class="form-message" id="plantMessage"></div>
                        <button type="submit" class="btn btn-primary">Добавить растение</button>
                    </form>
                </div>

                <div class="admin-card">
                    <h3>Список растений</h3>
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Цена</th>
                                    <th>Описание</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="plantsTableBody">
                                <tr><td colspan="5" class="loading">Загрузка...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Управление сотрудниками -->
            <section class="admin-section">
                <h2>👥 Управление сотрудниками</h2>
                
                <div class="admin-card">
                    <h3>Добавить сотрудника</h3>
                    <form id="employeeForm" class="admin-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Имя *</label>
                                <input type="text" id="employeeName" required>
                            </div>
                            <div class="form-group">
                                <label>Должность *</label>
                                <input type="text" id="employeeJob" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Дата начала работы *</label>
                            <input type="date" id="employeeDate" required>
                        </div>
                        <div class="form-message" id="employeeMessage"></div>
                        <button type="submit" class="btn btn-primary">Добавить сотрудника</button>
                    </form>
                </div>

                <div class="admin-card">
                    <h3>Список сотрудников</h3>
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Имя</th>
                                    <th>Должность</th>
                                    <th>Дата начала</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="employeesTableBody">
                                <tr><td colspan="5" class="loading">Загрузка...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
